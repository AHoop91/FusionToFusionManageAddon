site_name: Fusion Manage Add-in for Fusion
site_description: Publish Manufacturing Data Model items, BOMs and files from Fusion into Fusion Manage.
docs_dir: docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - 1. Overview: 01-overview.md
  - 2. Installation and Authentication: 02-installation-and-authentication.md
  - 3. Manufacturing Data Model: 03-manufacturing-data-model.md
  - 4. Publishing Enterprise Items: 04-publishing-enterprise-items.md
  - 5. BOM Synchronisation: 05-bom-synchronisation.md
  - 6. Technical Representation: 06-technical-representation.md
  - 7. Item Review & Release: 07-item-review-and-release.md
  - 8. Troubleshooting and Limitations: 08-troubleshooting-and-limitations.md
