site_name: Fusion Manage Add-in for Fusion
site_description: Publish Manufacturing Data Model items, BOMs and files from Fusion into Fusion Manage.
site_url: https://ahoop91.github.io/FusionToFusionManageAddon/
docs_dir: docs

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      accent: custom
      primary: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      accent: custom
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/overview.md
      - End-to-End Workflow: getting-started/workflow.md
      - Installation and Authentication: getting-started/installation.md
  - Configuration: configuration/index.md
  - Publishing: publishing/index.md
  - Item Panel: item-panel/index.md
  - Job Queue: job-queue/index.md
  - Troubleshooting and Limitations: reference/troubleshooting.md
