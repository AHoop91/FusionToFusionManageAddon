site_name: Fusion Manage - Item Management
site_description: Publish Manufacturing Data Model items, BOMs and files from Fusion into Fusion Manage.
site_url: https://ahoop91.github.io/FusionToFusionManageAddon/
docs_dir: docs
exclude_docs: |
  images/SHOT-LIST.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/sidebar-toggle.js
  - javascripts/sidebar-resize.js
  - javascripts/font-size.js

theme:
  name: material
  custom_dir: overrides
  logo: images/logo.svg
  favicon: images/logo.svg
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      accent: custom
      primary: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      accent: custom
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - i18n:
      # Translations sit next to the English page with a language suffix
      # (index.ja.md beside index.md), so images and relative links are shared.
      # A page with no translation falls back to English. Everything else uses
      # the plugin defaults (suffix layout, Material and search reconfigured).
      languages:
        - locale: en
          default: true
          name: English
        - locale: ja
          name: 日本語
          nav_translations:
            Home: ホーム
            Start here: はじめに
            Overview: 概要
            End-to-End Workflow: エンドツーエンドのワークフロー
            Set up: セットアップ
            Installation and Authentication: インストールと認証
            Configuration: 構成
            Use: 使用方法
            Publishing: 公開
            Item Panel: アイテム パネル
            Job Queue: ジョブ キュー
            Additional Information: 追加情報
            Manufacturing Data Model: 製造データ モデル
            Troubleshooting and Limitations: トラブルシューティングと制限事項
            Glossary: 用語集

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Start here:
      - Overview: getting-started/overview.md
      - End-to-End Workflow: getting-started/workflow.md
  - Set up:
      - Installation and Authentication: getting-started/installation.md
      - Configuration: configuration/index.md
  - Use:
      - Publishing: publishing/index.md
      - Item Panel: item-panel/index.md
      - Job Queue: job-queue/index.md
  - Additional Information:
      - Manufacturing Data Model: reference/manufacturing-data-model.md
      - Troubleshooting and Limitations: reference/troubleshooting.md
      - Glossary: getting-started/glossary.md
