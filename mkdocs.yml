site_name: Fusion Manage - Item Management
site_description: Publish Manufacturing Data Model items, BOMs and files from Fusion into Fusion Manage.
site_url: https://ahoop91.github.io/FusionToFusionManageAddon/
docs_dir: docs
exclude_docs: |
  images/SHOT-LIST.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/sidebar-toggle.js
  - javascripts/sidebar-resize.js
  - javascripts/font-size.js

theme:
  name: material
  custom_dir: overrides
  logo: images/logo.svg
  favicon: images/logo.svg
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      accent: custom
      primary: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      accent: custom
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Start here:
      - Overview: getting-started/overview.md
      - End-to-End Workflow: getting-started/workflow.md
  - Set up:
      - Installation and Authentication: getting-started/installation.md
      - Configuration: configuration/index.md
  - Use:
      - Publishing: publishing/index.md
      - Item Panel: item-panel/index.md
      - Job Queue: job-queue/index.md
  - Additional Information:
      - Manufacturing Data Model: reference/manufacturing-data-model.md
      - Troubleshooting and Limitations: reference/troubleshooting.md
      - Glossary: getting-started/glossary.md
