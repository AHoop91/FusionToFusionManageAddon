site_name: Fusion Manage Add-in for Fusion
site_description: Publish Manufacturing Data Model items, BOMs and files from Fusion into Fusion Manage.
site_url: https://ahoop91.github.io/FusionToFusionManageAddon/
docs_dir: docs

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      accent: custom
      primary: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      accent: custom
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Overview: getting-started/overview.md
  - End-to-End Workflow: getting-started/workflow.md
  - Installation and Authentication: getting-started/installation.md
  - Configuration:
      - configuration/index.md
      - Manufacturing Data Model: configuration/data-model.md
      - Workspace and Field Mapping: configuration/field-mapping.md
  - Publishing:
      - publishing/index.md
      - Item Creation: publishing/item-creation.md
      - Item Update: publishing/item-update.md
      - Bill of Materials: publishing/bill-of-materials.md
      - STEP File: publishing/step-file.md
      - Drawing Representation: publishing/drawing-representation.md
  - Item Panel:
      - item-panel/index.md
      - Tabs: item-panel/tabs.md
      - Review and Release: item-panel/review-and-release.md
  - Job Queue:
      - job-queue/index.md
      - Request Files and Retry: job-queue/request-files-and-retry.md
  - Troubleshooting and Limitations: reference/troubleshooting.md
