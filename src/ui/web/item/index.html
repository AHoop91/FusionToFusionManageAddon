<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fusion Manage Item</title>
  <!-- Shared panel styles -->
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="../shared/css/layout.css">
  <link rel="stylesheet" href="../shared/css/header.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="../shared/css/toast.css">
  <link rel="stylesheet" href="../shared/css/progress.css">
  <link rel="stylesheet" href="../shared/css/step-progress.css">
  <!-- Item panel styles -->
  <link rel="stylesheet" href="css/item.css">
</head>
<body>
  <!-- Shared top bar, filled in by shell.js. -->
  <header id="app-header" class="app-header"></header>
  <!-- ===== Signed-out view: sign-in only ================================ -->
  <div id="view-login" class="view">
    <div id="login-form" class="view-scroll" hidden>
      <div class="card login-card">
        <h2>Sign in to Fusion Manage</h2>
        <p id="conn-summary" class="muted">Loading...</p>
        <div class="row">
          <button id="signin-btn" class="btn">Sign in</button>
        </div>
        <p id="conn-error" class="error" hidden></p>
      </div>
    </div>

    <!-- Shown instead of the form while the browser sign-in is pending. -->
    <div id="login-loader" class="loader">
      <div class="balls" role="status" aria-label="Logging in"><span></span><span></span><span></span></div>
      <p class="muted">Logging in...</p>
      <button id="cancel-btn" class="btn btn-secondary">Cancel</button>
    </div>
  </div>

  <!-- ===== Signed-in view ============================================== -->
  <div id="view-app" class="view" hidden>
    <!-- Bouncing balls until the item, its layout and its images are all read. -->
    <div id="item-loader" class="loader">
      <div class="balls" role="status" aria-label="Loading item"><span></span><span></span><span></span></div>
      <p id="item-loader-text" class="muted">Loading item...</p>
    </div>

    <!-- Shown, centred, in place of the item: when no item has the number, or the user may not view the workspace. -->
    <div id="item-empty" class="loader item-empty" hidden>
      <svg id="item-empty-icon" class="item-empty-icon" viewBox="0 0 24 24" aria-hidden="true"></svg>
      <p id="item-empty-text" class="item-empty-text"></p>
      <p id="item-empty-hint" class="item-empty-hint"></p>
    </div>

    <!-- Header: the item's title, its life cycle line, and its actions. -->
    <header class="item-bar item-part">
      <div class="item-bar-text">
        <h1 id="item-title" class="item-title">Fusion Manage Item</h1>
        <p id="item-status" class="item-status"></p>
      </div>
      <div class="item-actions">
        <button id="item-open" class="item-icon-btn" type="button" hidden title="Open in browser" aria-label="Open this item in Fusion Manage in your browser">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        </button>
        <button id="item-refresh" class="item-icon-btn" type="button" title="Refresh" aria-label="Read the item again from Fusion Manage">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg>
        </button>
        <div id="item-actions-menu" class="item-menu" hidden>
          <button id="item-actions-btn" class="item-icon-btn item-menu-btn" type="button" title="Actions" aria-label="Actions" aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3.5"/></svg>
          </button>
          <div id="item-actions-list" class="item-menu-list" role="menu" hidden>
            <button class="item-menu-item" type="button" role="menuitem" data-action="publish_item">
              <svg class="item-menu-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
              <span>Publish Fusion Manage Item</span>
            </button>
            <button class="item-menu-item" type="button" role="menuitem" data-action="add_step_file">
              <span class="item-menu-icon" data-ext=".step"></span>
              <span>Upload STEP File</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Tabs of an item in Fusion Manage. Item, Files, Bill of Materials, Where Used and Associated Workflows are built so far. -->
    <nav class="item-tabs item-part">
      <button id="item-tab-item" class="item-tab item-tab-active" type="button" data-tab="item"></button>
      <button id="item-tab-files" class="item-tab" type="button" data-tab="files"></button>
      <button id="item-tab-bom" class="item-tab" type="button" data-tab="bom"></button>
      <button id="item-tab-whereused" class="item-tab" type="button" data-tab="whereused"></button>
      <button id="item-tab-workflows" class="item-tab" type="button" data-tab="workflows"></button>
    </nav>

    <!-- The item's sections: fields as label and value, matrices as grids. -->
    <div class="view item-part">
      <div id="item-body" class="view-scroll"></div>
      <div id="item-files" class="view-scroll item-files" hidden></div>
      <div id="item-bom" class="view-scroll item-bom" hidden></div>
      <div id="item-whereused" class="view-scroll item-where-used" hidden></div>
      <div id="item-workflows" class="view-scroll item-workflows" hidden></div>
    </div>
  </div>

  <!-- A clicked image, enlarged over the panel. A click or Escape closes it. -->
  <div id="item-lightbox" class="item-lightbox" role="dialog" aria-modal="true" aria-label="Image" hidden>
    <img id="item-lightbox-img" alt="">
  </div>

  <!-- Progress of the STEP upload, over the panel while it runs. -->
  <div id="progress" class="progress-backdrop" hidden>
    <div id="progress-card" class="progress" role="dialog" aria-modal="true" aria-label="Uploading STEP File"></div>
  </div>

  <!-- Shared shell -->
  <script src="../shared/js/dom.js"></script>
  <script src="../shared/js/bridge.js"></script>
  <script src="../shared/js/shell.js"></script>
  <script src="../shared/js/toast.js"></script>
  <script src="../shared/js/step-progress.js"></script>
  <script src="../shared/js/account.js"></script>
  <script src="../shared/js/auth.js"></script>
  <!-- Item panel -->
  <script src="js/safe-html.js"></script>
  <script src="js/tree.js"></script>
  <script src="js/files.js"></script>
  <script src="js/where-used.js"></script>
  <script src="js/associated-workflows.js"></script>
  <script src="js/bom.js"></script>
  <script src="js/item.js"></script>
</body>
</html>
