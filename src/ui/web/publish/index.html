<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n="publish.page_title">Publish Item</title>
  <!-- Shared panel styles -->
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="../shared/css/layout.css">
  <link rel="stylesheet" href="../shared/css/header.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="../shared/css/picker.css">
  <link rel="stylesheet" href="../shared/css/form-controls.css">
  <link rel="stylesheet" href="../shared/css/section.css">
  <!-- Publish panel styles -->
  <link rel="stylesheet" href="css/publish.css">
  <link rel="stylesheet" href="css/bom.css">
  <link rel="stylesheet" href="css/details.css">
  <link rel="stylesheet" href="css/add-items.css">
  <link rel="stylesheet" href="css/mbom-viewer.css">
  <link rel="stylesheet" href="css/item-panel.css">
  <link rel="stylesheet" href="../shared/css/toast.css">
  <link rel="stylesheet" href="../shared/css/tooltip.css">
  <link rel="stylesheet" href="../shared/css/progress.css">
</head>
<body>
  <!-- Shared top bar, filled in by shell.js. -->
  <header id="app-header" class="app-header"></header>

  <!-- ===== Signed-out view: sign-in only ================================ -->
  <div id="view-login" class="view">
    <div id="login-form" class="view-scroll" hidden>
      <div class="card login-card">
        <h2 data-i18n="publish.signin_heading">Sign in to Fusion Manage</h2>
        <p id="conn-summary" class="muted" data-i18n="publish.loading">Loading...</p>
        <div class="row">
          <button id="signin-btn" class="btn" data-i18n="publish.signin_button">Sign in</button>
        </div>
        <p id="conn-error" class="error" hidden></p>
      </div>
    </div>

    <!-- Shown instead of the form while the browser sign-in is pending. -->
    <div id="login-loader" class="loader">
      <div class="balls" role="status" aria-label="Logging in" data-i18n-attr="aria-label:publish.logging_in_label"><span></span><span></span><span></span></div>
      <p class="muted" data-i18n="publish.logging_in">Logging in...</p>
      <button id="cancel-btn" class="btn btn-secondary" data-i18n="publish.cancel">Cancel</button>
    </div>
  </div>

  <!-- ===== Signed-in view ============================================== -->
  <div id="view-app" class="view" hidden>
    <!-- Shown while the model loads. -->
    <div id="pub-loader" class="loader">
      <div class="balls" role="status" aria-label="Loading item" data-i18n-attr="aria-label:publish.loading_item_label"><span></span><span></span><span></span></div>
      <p class="muted" data-i18n="publish.loading_item">Loading item...</p>
    </div>

    <!-- Shown, centred, in place of the item, when the user may not publish to the Items workspace. -->
    <div id="pub-denied" class="loader pub-denied" hidden>
      <svg class="pub-denied-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>
      <p id="pub-denied-text" class="pub-denied-text"></p>
    </div>

    <div id="pub-content" class="view" hidden>
      <!-- Summary of the open model, filled in by publish.js. -->
      <div class="pub-summary">
        <div id="pub-thumb" class="pub-thumb" aria-hidden="true"></div>
        <div id="pub-summary" class="pub-summary-text"><p class="muted" data-i18n="publish.loading">Loading...</p></div>
        <div class="pub-summary-tools">
        <!-- Read the design, its Bill of Materials and Fusion Manage again. The panel never does this by itself for the design that is open. -->
        <button id="pub-refresh" class="pub-tool" type="button" title="Refresh from Fusion Manage" aria-label="Refresh from Fusion Manage" data-i18n-attr="title:publish.refresh_title;aria-label:publish.refresh_title">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
        </button>
        </div>
        <!-- The manufacturing bills of materials Fusion Manage holds for the design, to choose which one the Bill of Materials is compared with; filled in by publish-mbom.js. -->
        <div id="pub-mbom" class="pub-mbom" hidden></div>
      </div>

      <!-- The bill of materials: the loading skeleton, then the structure viewer; the details of a component open beside it. -->
      <main class="pub-main">
        <div class="pub-bom-pane">
          <div class="pub-pane-header">
            <span class="pub-pane-title" data-i18n="publish.bom_title">Bill of Materials</span>
          </div>
          <section id="pub-bom" class="pub-bom"></section>
          <section id="pub-structure" class="pub-structure" hidden></section>
        </div>
        <div id="pub-backdrop" class="pub-backdrop" hidden></div>
        <aside id="pub-detail" class="pub-detail" hidden>
          <div id="pub-detail-resize" class="pub-detail-resize" role="separator" aria-orientation="vertical" aria-label="Resize details" title="Drag to resize (double-click to reset)" data-i18n-attr="aria-label:publish.detail_resize_label;title:publish.detail_resize_title" tabindex="0"></div>
          <div class="pub-pane-header">
            <span class="pub-pane-title" data-i18n="publish.details_panel">Details Panel</span>
            <button id="pub-detail-close" class="pub-detail-close" type="button" title="Close details" aria-label="Close details" data-i18n-attr="title:publish.details_close;aria-label:publish.details_close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          </div>
          <div id="pub-props" class="pub-props"></div>
        </aside>
      </main>

      <!-- Actions for the open item. -->
      <footer class="pub-footer">
        <button id="pub-publish" class="btn" disabled title="Waiting for the Bill of Materials." data-i18n="publish.publish" data-i18n-attr="title:publish.waiting_bom">Publish</button>
      </footer>
    </div>
  </div>

  <!-- Progress of the publish just queued, filled in by publish-jobs.js. It can be closed; the run continues. -->
  <div id="progress" class="progress-backdrop" hidden>
    <div class="progress pub-modal" role="dialog" aria-modal="true" aria-labelledby="progress-title" aria-describedby="progress-status">
      <div class="pub-modal-head">
        <span id="progress-badge" class="pub-badge" aria-hidden="true"></span>
        <div class="pub-modal-text">
          <h2 id="progress-title" class="progress-title"></h2>
          <p id="progress-status" class="progress-status"></p>
        </div>
      </div>
      <!-- Steps, one after the other: every item number is looked up in Fusion Manage, then the items and their Bill of Materials are published. -->
      <div id="validate-step" class="progress-step">
        <p class="progress-step-head"><span class="progress-step-name" data-i18n="publish.step_validating">Validating</span><span id="validate-count" class="muted"></span></p>
        <div id="validate-bar" class="progress-bar" role="progressbar" aria-label="Validating" data-i18n-attr="aria-label:publish.step_validating" aria-valuemin="0" aria-valuemax="100">
          <div id="validate-fill" class="progress-fill"></div>
        </div>
      </div>
      <div id="publish-step" class="progress-step">
        <p class="progress-step-head"><span class="progress-step-name" data-i18n="publish.step_publishing">Publishing</span><span id="progress-count" class="muted"></span></p>
        <div id="progress-bar" class="progress-bar" role="progressbar" aria-label="Publishing" data-i18n-attr="aria-label:publish.step_publishing" aria-valuemin="0" aria-valuemax="100">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>
      <p class="muted progress-count"><span id="progress-elapsed"></span></p>
      <div id="progress-tally" class="progress-tally" role="group" aria-label="Items by result" data-i18n-attr="aria-label:publish.tally_label" hidden>
        <div class="progress-stat progress-stat-ok"><b id="tally-ok">0</b><span data-i18n="publish.tally_ok">Successful</span></div>
        <div class="progress-stat progress-stat-failed"><b id="tally-failed">0</b><span data-i18n="publish.tally_failed">Failed</span></div>
        <div class="progress-stat progress-stat-skipped" id="tally-skipped-box" hidden><b id="tally-skipped">0</b><span data-i18n="publish.tally_skipped">Skipped</span></div>
        <div class="progress-stat progress-stat-pending"><b id="tally-pending">0</b><span data-i18n="publish.tally_pending">Pending</span></div>
      </div>
      <p id="progress-note" class="muted progress-note"></p>
      <div id="progress-confirm" class="progress-confirm" role="alertdialog" aria-labelledby="progress-confirm-text" hidden>
        <p id="progress-confirm-text" data-i18n="publish.confirm_text">Cancel this publish? Items already processed are kept in the folder; the rest will not be published.</p>
        <div class="progress-actions">
          <button id="progress-keep" class="btn btn-secondary" type="button" data-i18n="publish.keep_publishing">Keep publishing</button>
          <button id="progress-stop" class="btn progress-danger" type="button" data-i18n="publish.confirm_cancel">Yes, cancel publish</button>
        </div>
      </div>
      <div id="progress-actions" class="progress-actions">
        <button id="progress-cancel" class="btn btn-secondary" type="button" data-i18n="publish.cancel_publish">Cancel publish</button>
        <button id="progress-close" class="btn" type="button" data-i18n="publish.close">Close</button>
      </div>
    </div>
  </div>

  <!-- Shared shell -->
  <script src="../shared/js/dom.js"></script>
  <script src="../shared/js/bridge.js"></script>
  <script src="../shared/js/i18n.js"></script>
  <script src="../shared/js/shell.js"></script>
  <script src="../shared/js/account.js"></script>
  <script src="../shared/js/auth.js"></script>
  <script src="../shared/js/picker.js"></script>
  <script src="../shared/js/validators.js"></script>
  <script src="../shared/js/form-controls.js"></script>
  <script src="../shared/js/section.js"></script>
  <!-- Publish panel -->
  <script src="js/ui.js"></script>
  <script src="../shared/js/toast.js"></script>
  <script src="../shared/js/tooltip.js"></script>
  <script src="js/bom-tree.js"></script>
  <script src="js/bom-model.js"></script>
  <script src="js/mbom-structure.js"></script>
  <script src="js/mbom-plan.js"></script>
  <script src="js/details.js"></script>
  <script src="js/add-items.js"></script>
  <script src="js/item-panel.js"></script>
  <script src="js/mbom-viewer.js"></script>
  <script src="js/publish-jobs.js"></script>
  <script src="js/publish-bom.js"></script>
  <script src="js/publish-mbom.js"></script>
  <script src="js/publish.js"></script>
</body>
</html>
