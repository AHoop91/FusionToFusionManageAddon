<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Publish Item</title>
  <!-- Shared panel styles -->
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="../shared/css/layout.css">
  <link rel="stylesheet" href="../shared/css/header.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <!-- Publish panel styles -->
  <link rel="stylesheet" href="css/publish.css">
  <link rel="stylesheet" href="css/bom.css">
  <link rel="stylesheet" href="css/details.css">
  <link rel="stylesheet" href="css/add-items.css">
  <link rel="stylesheet" href="../shared/css/toast.css">
  <link rel="stylesheet" href="../shared/css/diff-report.css">
  <link rel="stylesheet" href="../shared/css/progress.css">
</head>
<body>
  <!-- Shared top bar, filled in by shell.js. -->
  <header id="app-header" class="app-header"></header>

  <!-- ===== Signed-out view: sign-in only ================================ -->
  <div id="view-login" class="view">
    <div id="login-form" class="view-scroll" hidden>
      <div class="card login-card">
        <h2>Sign in to Fusion Manage</h2>
        <p id="conn-summary" class="muted">Loading...</p>
        <div class="row">
          <button id="signin-btn" class="btn">Sign in</button>
          <button class="btn btn-secondary" type="button" data-close>Close</button>
        </div>
        <p id="conn-error" class="error" hidden></p>
      </div>
    </div>

    <!-- Shown instead of the form while the browser sign-in is pending. -->
    <div id="login-loader" class="loader">
      <div class="balls" role="status" aria-label="Logging in"><span></span><span></span><span></span></div>
      <p class="muted">Logging in...</p>
      <button id="cancel-btn" class="btn btn-secondary">Cancel</button>
    </div>
  </div>

  <!-- ===== Signed-in view ============================================== -->
  <div id="view-app" class="view" hidden>
    <!-- Shown while the model loads. -->
    <div id="pub-loader" class="loader">
      <div class="balls" role="status" aria-label="Loading item"><span></span><span></span><span></span></div>
      <p class="muted">Loading item...</p>
    </div>

    <!-- Shown, centred, in place of the item, when the user may not publish to the Items workspace. -->
    <div id="pub-denied" class="loader pub-denied" hidden>
      <svg class="pub-denied-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>
      <p id="pub-denied-text" class="pub-denied-text"></p>
    </div>

    <div id="pub-content" class="view" hidden>
      <!-- Summary of the open model, filled in by publish.js. -->
      <div class="pub-summary">
        <div id="pub-thumb" class="pub-thumb" aria-hidden="true"></div>
        <div id="pub-summary" class="pub-summary-text"><p class="muted">Loading...</p></div>
        <!-- Is the design up to date in Fusion Manage? Scans in the background; filled in by publish.js. -->
        <button id="pub-check" class="pub-check" type="button" data-state="idle" aria-label="Checking Fusion Manage">
          <svg class="pub-check-ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15"/></svg>
          <svg class="pub-check-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="pub-check-tick" d="M6 12.5l4 4 8-9"/><path class="pub-check-bang" d="M12 7v6.5M12 17v.2"/></svg>
          <span id="pub-check-count" class="pub-check-count" hidden></span>
        </button>
      </div>

      <!-- The bill of materials; a row click opens that component's details beside it. -->
      <main class="pub-main">
        <div class="pub-bom-pane">
          <div class="pub-pane-header">
            <span class="pub-pane-title">Bill of Materials</span>
            <button id="pub-add-items" class="btn pub-pane-action" type="button">Add Existing Items</button>
          </div>
          <section id="pub-bom" class="pub-bom"></section>
        </div>
        <div id="pub-backdrop" class="pub-backdrop" hidden></div>
        <aside id="pub-detail" class="pub-detail" hidden>
          <div id="pub-detail-resize" class="pub-detail-resize" role="separator" aria-orientation="vertical" aria-label="Resize details" title="Drag to resize (double-click to reset)" tabindex="0"></div>
          <div class="pub-pane-header">
            <span class="pub-pane-title">Details Panel</span>
            <button id="pub-detail-close" class="pub-detail-close" type="button" title="Close details" aria-label="Close details"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          </div>
          <div id="pub-props" class="pub-props"></div>
        </aside>
      </main>

      <!-- Actions for the open item. -->
      <footer class="pub-footer">
        <button id="pub-refresh" class="btn btn-secondary">Refresh</button>
        <button class="btn btn-secondary" type="button" data-close>Close</button>
        <button id="pub-publish" class="btn" disabled title="Waiting for the Bill of Materials.">Publish</button>
      </footer>
    </div>
  </div>

  <!-- Progress of the publish just queued, filled in by publish-jobs.js. It can be closed; the run continues. -->
  <div id="progress" class="progress-backdrop" hidden>
    <div class="progress" role="dialog" aria-modal="true" aria-labelledby="progress-title" aria-describedby="progress-status">
      <h2 id="progress-title" class="progress-title"></h2>
      <p id="progress-status" class="progress-status"></p>
      <div id="progress-bar" class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <p id="progress-count" class="muted progress-count"></p>
      <p id="progress-note" class="muted progress-note"></p>
      <div id="progress-confirm" class="progress-confirm" role="alertdialog" aria-labelledby="progress-confirm-text" hidden>
        <p id="progress-confirm-text">Cancel this publish? Items already processed are kept in the folder; the rest will not be published.</p>
        <div class="progress-actions">
          <button id="progress-keep" class="btn btn-secondary" type="button">Keep publishing</button>
          <button id="progress-stop" class="btn progress-danger" type="button">Yes, cancel publish</button>
        </div>
      </div>
      <div id="progress-actions" class="progress-actions">
        <button id="progress-cancel" class="btn btn-secondary" type="button">Cancel publish</button>
        <button id="progress-close" class="btn" type="button">Close</button>
      </div>
    </div>
  </div>

  <!-- Shared shell -->
  <script src="../shared/js/dom.js"></script>
  <script src="../shared/js/bridge.js"></script>
  <script src="../shared/js/shell.js"></script>
  <script src="../shared/js/account.js"></script>
  <script src="../shared/js/auth.js"></script>
  <!-- Publish panel -->
  <script src="js/ui.js"></script>
  <script src="../shared/js/toast.js"></script>
  <script src="../shared/js/diff-report.js"></script>
  <script src="js/bom-model.js"></script>
  <script src="js/bom-table.js"></script>
  <script src="js/details.js"></script>
  <script src="js/add-items.js"></script>
  <script src="js/publish-jobs.js"></script>
  <script src="js/publish.js"></script>
</body>
</html>
