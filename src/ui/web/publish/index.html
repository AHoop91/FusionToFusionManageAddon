<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Publish Item</title>
  <!-- Shared panel styles -->
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="../shared/css/layout.css">
  <link rel="stylesheet" href="../shared/css/header.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <!-- Publish panel styles -->
  <link rel="stylesheet" href="css/publish.css">
</head>
<body>
  <!-- Shared top bar, filled in by shell.js. -->
  <header id="app-header" class="app-header"></header>

  <!-- ===== Signed-out view: sign-in only ================================ -->
  <div id="view-login" class="view">
    <div id="login-form" class="view-scroll" hidden>
      <div class="card login-card">
        <h2>Sign in to Fusion Manage</h2>
        <p id="conn-summary" class="muted">Loading...</p>
        <div class="row">
          <button id="signin-btn" class="btn">Sign in</button>
        </div>
        <p id="conn-error" class="error" hidden></p>
      </div>
    </div>

    <!-- Shown instead of the form while the browser sign-in is pending. -->
    <div id="login-loader" class="loader">
      <div class="balls" role="status" aria-label="Logging in"><span></span><span></span><span></span></div>
      <p class="muted">Logging in...</p>
      <button id="cancel-btn" class="btn btn-secondary">Cancel</button>
    </div>
  </div>

  <!-- ===== Signed-in view ============================================== -->
  <div id="view-app" class="view" hidden>
    <!-- Shown while the model loads. -->
    <div id="pub-loader" class="loader">
      <div class="balls" role="status" aria-label="Loading item"><span></span><span></span><span></span></div>
      <p class="muted">Loading item...</p>
    </div>
  
      <div id="pub-content" class="view" hidden>
      <!-- Summary of the open model, filled in by publish.js. -->
      <div class="pub-summary">
        <div id="pub-thumb" class="pub-thumb" aria-hidden="true"></div>
        <div id="pub-summary" class="pub-summary-text"><p class="muted">Loading...</p></div>
      </div>
  
      <nav class="tabs" data-group="publish" role="tablist">
        <button class="tab active" data-tab="details">Details</button>
        <button class="tab" data-tab="bom">Bill of Materials</button>
      </nav>
  
      <main>
        <section id="pub-tab-details" class="tab-panel active" data-group="publish"></section>
        <section id="pub-tab-bom" class="tab-panel" data-group="publish"></section>
      </main>

      <!-- Actions for the open item. -->
      <footer class="pub-footer">
        <button id="pub-refresh" class="btn btn-secondary">Refresh</button>
        <button id="pub-publish" class="btn" disabled title="Publishing to Fusion Manage is not built yet.">Publish</button>
      </footer>
    </div>
  </div>

  <!-- Shared shell -->
  <script src="../shared/js/dom.js"></script>
  <script src="../shared/js/bridge.js"></script>
  <script src="../shared/js/shell.js"></script>
  <script src="../shared/js/account.js"></script>
  <script src="../shared/js/auth.js"></script>
  <script src="../shared/js/tabs.js"></script>
  <!-- Publish panel -->
  <script src="js/publish.js"></script>
</body>
</html>
